<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Glow Filter -->
  <defs>
    <radialGradient id="flameInner" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="35%" stop-color="#FFEB3B" />
      <stop offset="70%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="50%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Flame Background Aura -->
  <circle cx="50" cy="46" r="34" fill="#FFC107" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Sacred Outer Flame -->
  <path d="M50 8 C53 22, 68 28, 70 45 C72 58, 62 72, 50 75 C38 72, 28 58, 30 45 C32 30, 42 22, 45 15 C47 12, 49 10, 50 8 Z" fill="url(#flameOuter)" />
  
  <!-- Outer Left Flick -->
  <path d="M48 10 C42 24, 30 32, 27 48 C24 60, 32 71, 44 75 C34 71, 26 58, 29 44 C32 30, 43 20, 48 10 Z" fill="#BF360C" />

  <!-- Outer Right Flick -->
  <path d="M52 10 C58 24, 70 32, 73 48 C76 60, 68 71, 56 75 C66 71, 74 58, 71 44 C68 30, 57 20, 52 10 Z" fill="#E65100" />

  <!-- Middle Vibrant Flame -->
  <path d="M50 20 C54 32, 64 38, 64 50 C64 62, 56 70, 50 72 C44 70, 36 62, 36 50 C36 38, 46 32, 50 20 Z" fill="url(#flameInner)" />

  <!-- Inner Bright Core / Jyoti -->
  <path d="M50 32 C52 40, 58 46, 58 55 C58 64, 54 69, 50 70 C46 69, 42 64, 42 55 C42 46, 48 40, 50 32 Z" fill="#FFFDE7" />

  <!-- Inner Light Pip -->
  <ellipse cx="50" cy="58" rx="4" ry="7" fill="#FFFFFF" />

  <!-- Green Ribbon at Base -->
  <path d="M22 75 C35 71, 65 71, 78 75 C82 76, 80 82, 76 83 C65 80, 35 80, 24 83 C20 82, 18 76, 22 75 Z" fill="url(#ribbonGrad)" stroke="#FFD54F" stroke-width="0.75" />
  
  <!-- Ribbon Ribbon Ends -->
  <path d="M19 78 L23 84 L18 87 Z" fill="#1B5E20" stroke="#FFD54F" stroke-width="0.5" />
  <path d="M81 78 L77 84 L82 87 Z" fill="#1B5E20" stroke="#FFD54F" stroke-width="0.5" />

  <!-- Ribbon Text Impression -->
  <path d="M28 78 Q50 76 72 78" stroke="#FFE082" stroke-width="1.2" stroke-dasharray="1.5,1" stroke-linecap="round" fill="none" />
</svg>
